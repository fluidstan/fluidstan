name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint

  test:
    name: Tests (PHP ${{ matrix.php }}, Fluid ${{ matrix.fluid }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        fluid: ['^4.4', '^5.0']
        dependencies: [highest]
        include:
          - php: '8.2'
            fluid: '^4.4'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --no-update "typo3fluid/fluid:${{ matrix.fluid }}"
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: composer test

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - uses: ramsey/composer-install@v3
      # Pull requests: only mutants on changed lines, which takes seconds instead of a full run
      - if: github.event_name == 'pull_request'
        run: vendor/bin/infection --threads=max --git-diff-lines --git-diff-base=origin/${{ github.base_ref }} --min-msi=70 --min-covered-msi=70 --logger-github
      # Pushes to main and the weekly schedule: the full run
      - if: github.event_name != 'pull_request'
        run: composer test:mutation
