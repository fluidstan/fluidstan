<text x="453.0" y="22" text-anchor="middle" fill="#a9b1d6" font-size="12">fluidstan — docs/example</text>
<text x="20.0" y="66" fill="#9ece6a" xml:space="preserve">$ </text>
<text x="35.2" y="66" fill="#c0caf5" xml:space="preserve">vendor/bin/fluidstan</text>
<text x="20.0" y="104" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="123" fill="#3b4261" xml:space="preserve">|</text>
<text x="27.6" y="123" fill="#9ece6a" xml:space="preserve"> Line </text>
<text x="73.2" y="123" fill="#3b4261" xml:space="preserve">|</text>
<text x="80.8" y="123" fill="#9ece6a" xml:space="preserve"> Components/Molecule/ProductCard/ProductCard.html                                                        </text>
<text x="878.8" y="123" fill="#3b4261" xml:space="preserve">|</text>
<text x="20.0" y="142" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="161" fill="#c0caf5" xml:space="preserve">| 9    | Accessing &quot;title&quot; on App\Shop\Category|null: Fluid yields null when the subject is null.                |</text>
<text x="20.0" y="180" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="180" fill="#6b7089" xml:space="preserve">    fluidstan.property.nullable</text>
<text x="324.0" y="180" fill="#3b4261" xml:space="preserve">                                                                         |</text>
<text x="20.0" y="199" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="218" fill="#c0caf5" xml:space="preserve">| 10   | Property &quot;descripton&quot; does not exist on App\Shop\Product (no getter, isser, hasser or public property). |</text>
<text x="20.0" y="237" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="237" fill="#6b7089" xml:space="preserve">    fluidstan.property.unresolvable</text>
<text x="354.4" y="237" fill="#3b4261" xml:space="preserve">                                                                     |</text>
<text x="20.0" y="256" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="275" fill="#c0caf5" xml:space="preserve">| 12   | Argument &quot;price&quot; of shop:atom.price expects App\Shop\Money, string given.                               |</text>
<text x="20.0" y="294" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="294" fill="#6b7089" xml:space="preserve">    fluidstan.argument.type</text>
<text x="293.6" y="294" fill="#3b4261" xml:space="preserve">                                                                             |</text>
<text x="20.0" y="313" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="332" fill="#c0caf5" xml:space="preserve">| 13   | Cannot render App\Shop\Image: object without __toString().                                              |</text>
<text x="20.0" y="351" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="351" fill="#6b7089" xml:space="preserve">    fluidstan.output.object</text>
<text x="293.6" y="351" fill="#3b4261" xml:space="preserve">                                                                             |</text>
<text x="20.0" y="370" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="389" fill="#c0caf5" xml:space="preserve">| 15   | Cannot access &quot;label&quot; on string.                                                                        |</text>
<text x="20.0" y="408" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="408" fill="#6b7089" xml:space="preserve">    fluidstan.property.unresolvable</text>
<text x="354.4" y="408" fill="#3b4261" xml:space="preserve">                                                                     |</text>
<text x="20.0" y="427" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="446" fill="#c0caf5" xml:space="preserve">| 17   | Cannot iterate over string: f:for expects an array or Traversable.                                      |</text>
<text x="20.0" y="465" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="465" fill="#6b7089" xml:space="preserve">    fluidstan.for.notIterable</text>
<text x="308.8" y="465" fill="#3b4261" xml:space="preserve">                                                                           |</text>
<text x="20.0" y="484" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="503" fill="#c0caf5" xml:space="preserve">| 18   | Variable &quot;stock&quot; is not defined: it is neither an argument nor provided by                              |</text>
<text x="20.0" y="522" fill="#c0caf5" xml:space="preserve">|      | App\Shop\ComponentCollection::getAdditionalVariables().                                                 |</text>
<text x="20.0" y="541" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="541" fill="#6b7089" xml:space="preserve">    variable.undefined</text>
<text x="255.6" y="541" fill="#3b4261" xml:space="preserve">                                                                                  |</text>
<text x="20.0" y="560" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
<text x="20.0" y="579" fill="#c0caf5" xml:space="preserve">| 20   | Component shop:atom.price has no slot &quot;badge&quot;.                                                          |</text>
<text x="20.0" y="598" fill="#c0caf5" xml:space="preserve">|      | </text>
<text x="88.4" y="598" fill="#6b7089" xml:space="preserve">    fluid.component.unknownSlot</text>
<text x="324.0" y="598" fill="#3b4261" xml:space="preserve">                                                                         |</text>
<text x="20.0" y="617" fill="#3b4261" xml:space="preserve">+------+---------------------------------------------------------------------------------------------------------+</text>
